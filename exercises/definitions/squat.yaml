# Squat Exercise Definition
# Hedef kaslar: Quadriceps, Gluteus, Hamstrings

name: squat
display_name: "Squat"
type: repetition

target_muscles:
  - Quadriceps
  - Gluteus
  - Hamstrings
equipment: "Bodyweight or Barbell"
difficulty: beginner
default_reps: 10
default_sets: 3
rest_time: "60 seconds"
benefits:
  - "Builds lower body strength"
  - "Improves mobility and balance"
  - "Strengthens core muscles"
description: "Basic squat exercise targeting lower body muscles"

# Primary angle: hip → knee → ankle (actual knee flexion angle).
# This is reliable across camera angles and body types.
# Standing: ~175°  |  Parallel squat: ~90°  |  Deep squat: ~40–70°
angles:
  primary:
    points: [left_hip, left_knee, left_ankle]
    description: "Left knee angle (hip-knee-ankle)"

  right_side:
    points: [right_hip, right_knee, right_ankle]
    description: "Right knee angle (hip-knee-ankle)"

# State machine
state_order:
  - ascent
  - descent
  - start

states:
  start:
    condition: "angle > 155"
    description: "Standing — legs nearly straight"

  descent:
    condition: "angle > 90 and angle <= 155"
    description: "Bending down or rising up"

  ascent:
    condition: "angle <= 90"
    description: "At depth — at or below parallel"

# Rep is counted when the knee reaches ≤ 90° (at/below parallel) coming from descent.
counter:
  trigger_state: ascent
  from_state: descent

min_rep_duration: 0.8

feedback:
  knees_caving:
    condition: "left_knee_x < left_ankle_x - 20"
    message: "Knees caving in — push knees out over your toes"
    severity: warning

  leaning_forward:
    condition: "left_shoulder_x > left_hip_x + 50"
    message: "Too much forward lean — keep your chest up"
    severity: warning

  not_deep_enough:
    condition: "angle > 110 and angle < 145"
    message: "Go deeper — squat until thighs are at least parallel to the floor"
    severity: info

calibration:
  enabled: true
  reps: 3

smoothing:
  enabled: true
  window: 3

visualization:
  lines:
    - points: [left_shoulder, left_hip]
      color: [178, 102, 255]
      thickness: 2
    - points: [left_hip, left_knee]
      color: [178, 102, 255]
      thickness: 2
    - points: [left_knee, left_ankle]
      color: [178, 102, 255]
      thickness: 2
    - points: [right_shoulder, right_hip]
      color: [51, 153, 255]
      thickness: 2
    - points: [right_hip, right_knee]
      color: [51, 153, 255]
      thickness: 2
    - points: [right_knee, right_ankle]
      color: [51, 153, 255]
      thickness: 2

  circles:
    - point: left_hip
      color: [178, 102, 255]
      radius: 8
    - point: left_knee
      color: [178, 102, 255]
      radius: 8
    - point: left_ankle
      color: [178, 102, 255]
      radius: 8
    - point: right_hip
      color: [51, 153, 255]
      radius: 8
    - point: right_knee
      color: [51, 153, 255]
      radius: 8
    - point: right_ankle
      color: [51, 153, 255]
      radius: 8

  angle_display:
    - angle: primary
      position: left_knee
      offset: [10, -10]
      label: "Knee L"
    - angle: right_side
      position: right_knee
      offset: [10, -10]
      label: "Knee R"
